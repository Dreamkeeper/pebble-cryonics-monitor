{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 10vh auto;">
  <h2>Operator login</h2>
  {% if error %}<p class="danger">{{ error }}</p>{% endif %}
  {% if no_admins %}
    <p class="muted">No operator accounts exist yet. Set
    <code>CM_UI_ADMIN_USER</code> and <code>CM_UI_ADMIN_PASSWORD</code> in the
    server environment and restart to bootstrap the first admin.</p>
  {% endif %}
  <form method="post" action="/ui/login">
    <p><input name="username" placeholder="username" autofocus
              autocomplete="username" style="width: 100%"></p>
    <p><input name="password" type="password" placeholder="password"
              autocomplete="current-password" style="width: 100%"></p>
    <p><button style="width: 100%">Log in</button></p>
  </form>
</div>
{% endblock %}
